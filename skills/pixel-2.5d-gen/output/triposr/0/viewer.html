<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>3D 模型查看器 - 像素街机</title>
<style>
  body { margin: 0; background: #1e1e2e; }
  model-viewer { width: 100vw; height: 100vh; }
  .tip {
    position: fixed; top: 12px; left: 12px; color: #fff;
    font: 13px sans-serif; background: rgba(0,0,0,.5);
    padding: 8px 12px; border-radius: 6px;
  }
</style>
<script type="module" src="https://unpkg.com/@google/model-viewer@3/dist/model-viewer.min.js"></script>
</head>
<body>
<div class="tip">🖱 左键拖拽旋转 / 滚轮缩放 / 右键平移</div>
<model-viewer src="model.glb" auto-rotate auto-rotate-delay="0"
  rotation-per-second="30deg" camera-controls disable-tap
  background-color="#1e1e2e"></model-viewer>
</body>
</html>
